<h2 style="font-family:Arial,sans-serif;color:#0F1F3D">Reset your password</h2>
<p style="font-family:Arial,sans-serif;font-size:16px;color:#1C2536">
  We received a request to reset the password for your IPCM account.
</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;background:#0E7C6B;color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:999px">
    Choose a new password
  </a>
</p>
<p style="font-family:Arial,sans-serif;font-size:14px;color:#4A5468">
  This link expires in one hour. If you didn't ask for this, you can ignore this email; your password won't change.
</p>
